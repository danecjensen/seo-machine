# assets.gohappyclub.com: the R2 upload Worker in workers/assets.gohappyclub.com/.
# Separate from sites.yml, so it never waits on or blocks a marketing site's build or Lighthouse.
# Pull requests run its tests; pushes to main test and then deploy it.
#
# Uses the same CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as sites.yml. The token also
# needs Account > Workers Scripts > Edit and Zone > Workers Routes > Edit (gohappyclub.com).
name: assets

on:
  push:
    branches: [main]
    paths:
      - workers/assets.gohappyclub.com/**
      - .github/workflows/assets.yml
  pull_request:
    paths:
      - workers/assets.gohappyclub.com/**
      - .github/workflows/assets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:assets

      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/assets.gohappyclub.com/wrangler.toml
