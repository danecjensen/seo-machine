# Per domain: build + SEO check -> Lighthouse -> deploy to Cloudflare Pages.
# Each domain is its own job, so one failing site never blocks or changes another,
# and a site only deploys after its own checks pass.
#
# Deploys need two repository secrets: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit)
# and CLOUDFLARE_ACCOUNT_ID. Without them everything else still runs and the deploy step is skipped.
# Pushes to main deploy to production; pull requests from this repo get a preview URL.
name: sites

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: list
        run: echo "sites=$(node scripts/build.mjs --list)" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  site:
    needs: [discover, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.discover.outputs.sites) }}
    name: ${{ matrix.site }}
    # Never run two deploys of the same domain at once; a newer push wins. The event name keeps a
    # pull request run (whose ref can match main once it merges) from cancelling the main deploy.
    concurrency:
      group: site-${{ matrix.site }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history gives the sitemap real <lastmod> dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lighthouse/package-lock.json
      - run: npm ci

      - name: Build and SEO check
        run: npm run build -- --site "${{ matrix.site }}" --strict --verbose

      - name: Lighthouse
        run: |
          npm ci --prefix lighthouse
          node lighthouse/run-lighthouse.mjs --dist dist --sites sites --out lighthouse-reports --domain "${{ matrix.site }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.site }}
          path: |
            dist/${{ matrix.site }}
            lighthouse-reports/${{ matrix.site }}
          if-no-files-found: ignore

      - name: Deploy to Cloudflare Pages
        if: >-
          env.HAS_CLOUDFLARE == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy.mjs --site "${{ matrix.site }}"
