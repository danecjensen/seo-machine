# The ordering steps shown in the "How ordering works" section.
- title: Share your idea
  text: Pick a product, a rough quantity and your date, and send your logo.
- title: Approve a proof
  text: You'll get pricing and a digital mockup of your logo on the product.
- title: We make and ship it
  text: Once you approve the proof, we produce your order and send it your way.
