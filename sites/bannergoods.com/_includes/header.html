<div class="topline"><div class="wrap"><span>Custom merch, made to order since {{ site.founded }}</span><a href="{{ site.goals.cta.url }}">Start a project →</a></div></div>
<header class="site-header">
 <div class="wrap bar">
  <a class="brand" href="/" aria-label="Banner Goods home"><img class="brand-logo" src="/favicon.svg" width="40" height="40" alt=""><span class="brand-name"><span>Banner <em>Goods</em></span><small>Est. {{ site.founded }}</small></span></a>
  <nav aria-label="Main"><ul>{% for item in navigation %}<li><a href="{{ item.url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>{% endfor %}<li><a class="btn" href="{{ site.goals.cta.url }}">{{ site.goals.cta.text }}</a></li></ul></nav>
 </div>
</header>
