# Happy Club: custom promotional wearables (hats, tote bags, blankets, socks).
# Goal: email signups from people interested in creating custom products.
title: Happy Club
description: "Custom promotional wearables with your logo: embroidered hats, printed tote bags, woven blankets and custom socks for teams, brands and events."
url: https://gohappyclub.com
lang: en
locale: en_US
title_format: "{title} | {site}"
logo: /assets/logo.png
image:
  path: /assets/og.png
  alt: Happy Club custom hats, tote bags, blankets and socks
theme_color: "#c2410c"
colors:
  brand: "#c2410c"

goals:
  primary: Email signups from people interested in creating custom products
  audience: Businesses, schools, teams, nonprofits and event organizers ordering branded merch
  keywords: [custom promotional products, custom hats with logo, custom tote bags, custom blankets with logo, custom socks with logo]
  cta:
    text: Get ideas by email
    title: Thinking about custom products? Get ideas and tips by email.
    url: /signup/

# PLACEHOLDERS: fill these in before launch. Nothing here has been invented.
# Leave a value empty and the site shows a visible "[placeholder]" note instead.
contact:
  form_action: ""    # URL of the form handler that stores signups (Mailchimp, ConvertKit, Formspree...).
                     # Empty = the signup page shows a placeholder and other pages link to it.
                     # Set the handler to send people to https://gohappyclub.com/thanks/ afterwards.

# Add telephone, email and address here once they're confirmed, e.g.
#   telephone: "+1-555-555-5555"
#   email: hello@gohappyclub.com
#   address: { streetAddress: ..., addressLocality: ..., addressRegion: ..., postalCode: ..., addressCountry: US }
organization:
  type: Organization

defaults:
  - scope:
      path: products
    values:
      layout: product     # the product page archetype (_layouts/product.html)
      cta_title: Want this with your logo? Get ideas and tips by email.
      signup_form: true   # show the email signup form, not just a button

# Cloudflare Pages project gohappyclub-com. Both domains are attached on production deploys;
# www is redirected to the bare domain with a Cloudflare Redirect Rule (see README).
cloudflare:
  project: gohappyclub-com
  productionBranch: main
  domains: [gohappyclub.com, www.gohappyclub.com]
