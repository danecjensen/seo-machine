# The ordering steps shown by _includes/steps.html.
- title: Tell us what you need
  text: Pick a product, a rough quantity and the date you need it by, and send your logo.
- title: See a proof
  text: We'll come back with pricing and a digital mockup showing your logo on the product.
- title: Approve and relax
  text: Once you sign off on the proof, we make your order and ship it to you.
