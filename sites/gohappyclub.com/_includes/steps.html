{% comment %}The three ordering steps from _data/process.yml, shown on the home, collection and product pages.{% endcomment %}
<section class="section steps" aria-labelledby="steps-heading">
  <h2 id="steps-heading">How ordering works</h2>
  <ol class="step-list">
    {% for step in process %}
    <li><h3>{{ step.title }}</h3><p>{{ step.text }}</p></li>
    {% endfor %}
  </ol>
  <p><a href="/how-it-works/">More about how ordering works</a></p>
</section>
